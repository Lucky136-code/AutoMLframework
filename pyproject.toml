[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata (PEP 621)
# ---------------------------------------------------------------------------

[project]
name = "mentorml"
version = "0.1.0"
description = "AI Data Scientist Copilot — explains the *why* behind every ML decision."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "mentorml contributors" }]
keywords = ["machine-learning", "automl", "explainability", "data-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# ---------------------------------------------------------------------------
# Core runtime dependencies (kept minimal on purpose)
# ---------------------------------------------------------------------------

dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
#
# Install with:  pip install mentorml[shap]
#                pip install mentorml[report]
#                pip install mentorml[full]
# ---------------------------------------------------------------------------

[project.optional-dependencies]
shap = ["shap>=0.44"]
report = ["plotly>=5.18", "jinja2>=3.1"]
llm = ["openai>=1.0"]        # optional LLM narrator backend
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.4",
  "pre-commit>=3.7",
  "pandas-stubs>=2.0",
]
full = ["mentorml[shap,report,llm]"]

[project.urls]
Repository = "https://github.com/your-username/mentorml"

# ---------------------------------------------------------------------------
# Tool: ruff (linting + formatting)
#
# ruff replaces flake8 + isort + black.  One tool, one config section.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear (catches common bugs)
  "UP",  # pyupgrade (keeps code modern)
  "D",   # pydocstyle
  "ANN", # flake8-annotations (enforce type hints)
  "N",   # pep8-naming
]
ignore = [
  "D100",  # Missing docstring in public module — handled at package level
  "D104",  # Missing docstring in public package
  "D107",  # Missing docstring in __init__
  "ANN101", # Missing type annotation for `self` (too noisy)
  "ANN102", # Missing type annotation for `cls`
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Tool: mypy (static type checking)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = []

[[tool.mypy.overrides]]
# Third-party libs without full stubs — silence missing-stub errors
module = ["shap.*", "plotly.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tool: pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--tb=short",
  "--cov=mentorml",
  "--cov-report=term-missing",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
]

# ---------------------------------------------------------------------------
# Tool: coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["mentorml"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",      # Protocol stubs
]
